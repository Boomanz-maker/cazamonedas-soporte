<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CazaMonedas 5cnt</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071a00;
      font-family: Arial, Helvetica, sans-serif;
    }

    .pagina {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .imagen-app {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      ZONAS PULSABLES SOBRE LOS BOTONES
      DE LA IMAGEN
    */

    .boton-appstore,
    .boton-googleplay {
      position: absolute;
      display: block;

      /*
        Estas medidas están en porcentaje para que
        funcionen en cualquier tamaño de pantalla.
      */

      top: 78%;
      height: 6%;
      width: 44%;

      z-index: 10;
    }

    .boton-appstore {
      left: 5%;
    }

    .boton-googleplay {
      right: 5%;
    }
    
    .boton-appstore,
.boton-googleplay {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

  </style>

</head>

<script>

  function abrirAppStore() {
    // Cuando tengamos el enlace real de Apple,
    // lo pondremos aquí.
    alert("Próximamente disponible en App Store");
  }

  function abrirGooglePlay() {
    // Cuando tengamos el enlace real de Google Play,
    // lo pondremos aquí.
    alert("Próximamente disponible en Google Play");
  }

</script>

<body>

  <main class="pagina">

    <!-- IMAGEN PRINCIPAL -->

    <img
      src="cazamonedas-app.png"
      alt="CazaMonedas 5cnt"
      class="imagen-app"
    >


    <!--
      BOTÓN APP STORE

      Cuando tengas el enlace real de Apple,
      sustituiremos # por la URL de App Store.
    -->

   <div
  class="boton-appstore"
  role="button"
  aria-label="App Store"
  onclick="abrirAppStore()"
></div>

<div
  class="boton-googleplay"
  role="button"
  aria-label="Google Play"
  onclick="abrirGooglePlay()"
></div>

  </main>

</body>

</html>
