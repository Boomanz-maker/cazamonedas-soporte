<!DOCTYPE html>
<html lang="es">
<head>

  <title>CazaMonedas 5cnt</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #071a00;
      font-family: Arial, Helvetica, sans-serif;
    }
    .pagina {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }
    .imagen-app {
      display: block;
      width: 100%;
      height: auto;
    }
    /*
      ZONAS PULSABLES SOBRE LOS BOTONES
      DE LA IMAGEN
    */
    .boton-appstore,
    .boton-googleplay {
      position: absolute;
      display: block;
      /*
        Estas medidas están en porcentaje para que
        funcionen en cualquier tamaño de pantalla.
      */
      top: 78%;
      height: 6%;
      width: 44%;
      z-index: 10;
    }
    .boton-appstore {
      left: 5%;
    }
    .boton-googleplay {
      right: 5%;
    }
    .boton-appstore,
    .boton-googleplay {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /*
      CONTADOR DE VISITAS
    */
    .contador-visitas {
      text-align: center;
      margin: 20px 0 30px;
      min-height: 20px;
    }
    .contador-visitas img {
      max-width: 100%;
    }
  </style>
</head>
<script>
  function abrirAppStore() {
    window.location.href =
      "https://apps.apple.com/es/app/cazamonedas-5cnt/id6810556864";
  }
  function abrirGooglePlay() {
    alert("Próximamente disponible en Google Play");

</script>
<body>
  <main class="pagina">

>
<!-- BOTÓN APP STORE -->
<div
  class="boton-appstore"
  role="button"
  aria-label="App Store"
  onclick="abrirAppStore()"
></div>
<!-- BOTÓN GOOGLE PLAY -->
<div
  class="boton-googleplay"
  role="button"
  aria-label="Google Play"
  onclick="abrirGooglePlay()"
></div>

  <!-- CONTADOR DE VISITAS -->
