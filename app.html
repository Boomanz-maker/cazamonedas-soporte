<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CazaMonedas 5cnt</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071a00;
      font-family: Arial, Helvetica, sans-serif;
    }

    .pagina {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .imagen-app {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      ZONAS PULSABLES SOBRE LOS BOTONES
      DE LA IMAGEN
    */

    .boton-appstore,
    .boton-googleplay {
      position: absolute;
      display: block;

      /*
        Estas medidas están en porcentaje para que
        funcionen en cualquier tamaño de pantalla.
      */

      top: 78%;
      height: 6%;
      width: 44%;

      z-index: 10;
    }

    .boton-appstore {
      left: 5%;
    }

    .boton-googleplay {
      right: 5%;
    }

  </style>

</head>


<body>

  <main class="pagina">

    <!-- IMAGEN PRINCIPAL -->

    <img
      src="cazamonedas-app.png"
      alt="CazaMonedas 5cnt"
      class="imagen-app"
    >


    <!--
      BOTÓN APP STORE

      Cuando tengas el enlace real de Apple,
      sustituiremos # por la URL de App Store.
    -->

    <a
      href="#"
      class="boton-appstore"
      aria-label="Próximamente en App Store"
    ></a>


    <!--
      BOTÓN GOOGLE PLAY

      Cuando tengas el enlace real de Google Play,
      sustituiremos # por la URL de Google Play.
    -->

    <a
      href="#"
      class="boton-googleplay"
      aria-label="Próximamente en Google Play"
    ></a>

  </main>

</body>

</html>
